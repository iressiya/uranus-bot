<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Уранічна підказка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #05060F;
    --bg-mid: #0A0C22;
    --bg-panel: #10112E;
    --accent: #8FE3D6;
    --accent-deep: #4A9E93;
    --gold: #E8C888;
    --text: #EDEBF5;
    --muted: #82869E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 20px 40px;
    position: relative;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid) 0%, var(--bg) 65%);
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.15); }
    50% { opacity: var(--max-op, 0.9); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .orbit-wrap {
    position: relative;
    width: 230px;
    height: 230px;
    margin-bottom: 8px;
  }
  .orbit-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(143, 227, 214, 0.18);
    border-radius: 50%;
    transform: rotate(98deg) scaleY(0.3);
  }
  .orbit-ring.outer {
    inset: -20px;
    border-color: rgba(232, 200, 136, 0.12);
    transform: rotate(98deg) scaleY(0.3);
  }
  .orbit-ring.inner {
    inset: 14px;
    border-color: rgba(143, 227, 214, 0.28);
    transform: rotate(98deg) scaleY(0.3);
  }

  .planet {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0) 22%),
      repeating-linear-gradient(
        100deg,
        #B6F2E6 0%,
        #8FE3D6 6%,
        #6BC9BC 12%,
        #7DD8CB 18%,
        #5AB2A6 24%,
        #8FE3D6 30%
      );
    box-shadow:
      inset -18px -14px 30px rgba(0,0,0,0.45),
      inset 10px 8px 20px rgba(255,255,255,0.12),
      0 0 50px rgba(143, 227, 214, 0.25);
  }
  .planet::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 75%, rgba(0,0,0,0.35), transparent 55%);
  }

  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .date {
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 28px;
  }

  .tip-card {
    width: 100%;
    background: linear-gradient(160deg, var(--bg-panel), #0B0C26);
    border: 1px solid rgba(143, 227, 214, 0.08);
    border-radius: 20px;
    padding: 32px 26px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  }

  .tip-text {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--text);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .tip-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 28px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #05060F;
  }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(130, 134, 158, 0.35);
  }

  .footer-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="stage">
  <div class="orbit-wrap">
    <div class="orbit-ring outer"></div>
    <div class="orbit-ring"></div>
    <div class="orbit-ring inner"></div>
    <div class="planet"></div>
  </div>

  <div class="eyebrow">Ретроградний Уран</div>
  <div class="date" id="dateLabel">6 вересня 2026 — 8 лютого 2027</div>

  <div class="tip-card">
    <p class="tip-text" id="tipText"></p>
  </div>

  <div class="actions">
    <button class="btn-primary" id="nextBtn">Наступна підказка</button>
    <button class="btn-secondary" id="subscribeBtn">Оформити підписку</button>
  </div>

  <p class="footer-note">Нова підказка щоранку о 9:00,<br>якщо в тебе активна підписка.</p>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const tips = [
    "Уран радить сьогодні: не приймай важливих рішень зранку — дай ідеї відлежатись до вечора.",
    "Перегляньте старий проєкт, який ви покинули пів року тому. Можливо, час поглянути на нього інакше.",
    "Сьогодні гарний день, щоб сказати «ні» звичці, яка вже не служить вам.",
    "Записуйте інсайти, не діючи одразу — ретроградна енергія любить несподіванки в голові, а не в реальному житті.",
    "Перевірте: чи є у вашому графіку щось, що ви робите «бо так треба», а не «бо хочу»?",
    "День для ревізії стосунків з технікою — розберіть цифрове сміття.",
    "Бунт заради бунту — це не свобода. Справжня свобода тиха і усвідомлена.",
    "Спробуйте маленьку нову звичку в безпечному масштабі — без різких змін усього життя."
  ];

  let index = Math.floor(Math.random() * tips.length);
  const tipEl = document.getElementById('tipText');

  function showTip(i) {
    tipEl.classList.remove('visible');
    setTimeout(() => {
      tipEl.textContent = tips[i];
      tipEl.classList.add('visible');
    }, 200);
  }

  showTip(index);

  document.getElementById('nextBtn').addEventListener('click', () => {
    index = (index + 1) % tips.length;
    showTip(index);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  });

  document.getElementById('subscribeBtn').addEventListener('click', () => {
    if (tg) {
      tg.sendData('subscribe');
      tg.close();
    }
  });

  const starsContainer = document.getElementById('stars');
  const starColors = ['#E8C888', '#EDEBF5', '#8FE3D6'];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    const size = (Math.random() * 1.8 + 0.6).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = starColors[Math.floor(Math.random() * starColors.length)];
    s.style.setProperty('--min-op', (Math.random() * 0.15 + 0.05).toFixed(2));
    s.style.setProperty('--max-op', (Math.random() * 0.5 + 0.5).toFixed(2));
    s.style.animationDelay = (Math.random() * 4).toFixed(1) + 's';
    s.style.animationDuration = (Math.random() * 3 + 2.5).toFixed(1) + 's';
    starsContainer.appendChild(s);
  }
</script>

</body>
</html>
