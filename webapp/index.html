<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Уранічна підказка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0B1130;
    --bg-panel: #161B45;
    --accent: #7DE8D6;
    --gold: #F2C572;
    --text: #EDEBF5;
    --muted: #9BA0C7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 20px 40px;
    position: relative;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.5;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .orbit-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    margin-bottom: 8px;
  }
  .orbit-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(125, 232, 214, 0.35);
    border-radius: 50%;
    transform: rotate(98deg) scaleY(0.34);
  }
  .orbit-ring.outer {
    inset: -22px;
    border-color: rgba(242, 197, 114, 0.25);
    transform: rotate(98deg) scaleY(0.34);
  }
  .planet {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #A9F2E4, var(--accent) 55%, #4FA898 100%);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 40px rgba(125, 232, 214, 0.35);
  }

  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .date {
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 28px;
  }

  .tip-card {
    width: 100%;
    background: var(--bg-panel);
    border-radius: 20px;
    padding: 32px 26px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .tip-text {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--text);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .tip-text.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 28px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #0B1130;
  }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(155, 160, 199, 0.3);
  }

  .footer-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="stage">
  <div class="orbit-wrap">
    <div class="orbit-ring outer"></div>
    <div class="orbit-ring"></div>
    <div class="planet"></div>
  </div>

  <div class="eyebrow">Ретроградний Уран</div>
  <div class="date" id="dateLabel">6 вересня 2026 — 8 лютого 2027</div>

  <div class="tip-card">
    <p class="tip-text" id="tipText"></p>
  </div>

  <div class="actions">
    <button class="btn-primary" id="nextBtn">Наступна підказка</button>
    <button class="btn-secondary" id="subscribeBtn">Оформити підписку</button>
  </div>

  <p class="footer-note">Нова підказка щоранку о 9:00,<br>якщо в тебе активна підписка.</p>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const tips = [
    "Уран радить сьогодні: не приймай важливих рішень зранку — дай ідеї відлежатись до вечора.",
    "Перегляньте старий проєкт, який ви покинули пів року тому. Можливо, час поглянути на нього інакше.",
    "Сьогодні гарний день, щоб сказати «ні» звичці, яка вже не служить вам.",
    "Записуйте інсайти, не діючи одразу — ретроградна енергія любить несподіванки в голові, а не в реальному житті.",
    "Перевірте: чи є у вашому графіку щось, що ви робите «бо так треба», а не «бо хочу»?",
    "День для ревізії стосунків з технікою — розберіть цифрове сміття.",
    "Бунт заради бунту — це не свобода. Справжня свобода тиха і усвідомлена.",
    "Спробуйте маленьку нову звичку в безпечному масштабі — без різких змін усього життя."
  ];

  let index = Math.floor(Math.random() * tips.length);
  const tipEl = document.getElementById('tipText');

  function showTip(i) {
    tipEl.classList.remove('visible');
    setTimeout(() => {
      tipEl.textContent = tips[i];
      tipEl.classList.add('visible');
    }, 200);
  }

  showTip(index);

  document.getElementById('nextBtn').addEventListener('click', () => {
    index = (index + 1) % tips.length;
    showTip(index);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  });

  document.getElementById('subscribeBtn').addEventListener('click', () => {
    if (tg) {
      tg.sendData('subscribe');
      tg.close();
    }
  });

  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (Math.random() * 0.5 + 0.15).toFixed(2);
    const size = (Math.random() * 1.5 + 1).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsContainer.appendChild(s);
  }
</script>

</body>
</html>
